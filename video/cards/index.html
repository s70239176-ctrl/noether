<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Noether demo cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#01040e; --ink:#fff; --ink2:rgba(255,255,255,.8); --mute:rgba(255,255,255,.55); --line:rgba(255,255,255,.1);
    --blue:#2086ff; --soft:#8ab8ff; --red:#ff4d5e; --ok:#3ddc97; --grad:linear-gradient(180deg,#4d9dff,#2086ff 54%,#0e67cc); }
  * { box-sizing: border-box; }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .stage { position:relative; width:1920px; height:1080px; overflow:hidden; }
  .beams i { position:absolute; border-radius:50%; filter:blur(80px); opacity:.7; }
  .beams i:nth-child(1){ left:-10%; top:-60px; width:75%; height:300px; background:linear-gradient(90deg,transparent,rgba(32,134,255,.45),transparent); transform:rotate(-12deg); animation:drift 14s ease-in-out infinite alternate; }
  .beams i:nth-child(2){ right:-12%; top:80px; width:70%; height:260px; background:linear-gradient(90deg,transparent,rgba(14,103,204,.5),transparent); transform:rotate(14deg); animation:drift 18s ease-in-out infinite alternate-reverse; }
  .beams i:nth-child(3){ left:20%; bottom:-200px; width:60%; height:420px; background:radial-gradient(closest-side,rgba(32,134,255,.25),transparent); }
  @keyframes drift { to { transform:translateX(80px) rotate(-8deg); } }
  .wrap { position:absolute; inset:0; padding:110px 150px; display:flex; flex-direction:column; justify-content:center; z-index:2; }
  .pill { display:inline-block; align-self:flex-start; font-size:22px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; padding:9px 18px; border-radius:12px; background:var(--grad); box-shadow:0 10px 40px rgba(32,134,255,.45); }
  h1 { font-size:104px; line-height:1.06; letter-spacing:-.05em; font-weight:600; margin:28px 0 22px; }
  h2 { font-size:72px; line-height:1.1; letter-spacing:-.045em; font-weight:600; margin:26px 0 18px; }
  p.lead { font-size:38px; line-height:1.4; color:var(--ink2); margin:0; max-width:1400px; letter-spacing:-.01em; }
  .mono { font-family:"IBM Plex Mono",monospace; }
  .x { animation: rise .9s cubic-bezier(.2,.7,.2,1) var(--at,0s) both; }
  @keyframes rise { from { opacity:0; transform:translateY(34px); } to { opacity:1; transform:none; } }
  @keyframes riseX { from { opacity:0; transform:translateX(-40px); } to { opacity:1; transform:none; } }
  @keyframes fadein { from { opacity:0; } to { opacity:1; } }
  .redglow { position:absolute; left:15%; bottom:-260px; width:70%; height:520px; border-radius:50%; filter:blur(80px);
    background:radial-gradient(closest-side,rgba(255,77,94,.45),transparent); opacity:0; animation:fadein 1s var(--at,999s) both; }
  .card { border-radius:26px; background:linear-gradient(180deg,rgba(10,18,42,.92),rgba(4,8,20,.96)); border:1px solid var(--line); padding:34px 38px; position:relative; overflow:hidden; }
  .card::before { content:""; position:absolute; inset:0; background:radial-gradient(600px 280px at 50% 120%,rgba(32,134,255,.18),transparent 70%); pointer-events:none; }
  .red-t { color:var(--red); } .blue-t { color:var(--soft); } .ok-t { color:var(--ok); }
  /* hook */
  .bridge { display:flex; align-items:center; gap:40px; margin:46px 0 10px; }
  .chain { width:250px; height:250px; border-radius:50%; display:grid; place-items:center; font-size:32px; font-weight:600; text-align:center; box-shadow:0 0 80px rgba(32,134,255,.45); }
  .chain.base { background:radial-gradient(circle at 35% 30%,#cfe2ff,#2086ff 40%,#061a45); }
  .chain.uni { background:radial-gradient(circle at 35% 30%,#fff,#8ab8ff 40%,#14305e); color:#06102a; }
  .flow { flex:1; height:6px; border-radius:6px; background:linear-gradient(90deg,#2086ff,#8ab8ff); position:relative; overflow:hidden; }
  .flow::after { content:""; position:absolute; top:-10px; left:-80px; width:80px; height:26px; border-radius:20px; background:#fff; box-shadow:0 0 30px #fff; animation:tok 1.8s linear infinite; }
  @keyframes tok { to { left:100%; } }
  .glitch { color:var(--red); text-shadow:4px 0 #2086ff,-4px 0 #ff4d5e; animation: rise .5s ease var(--at) both, gl .18s steps(2) var(--at) infinite; }
  @keyframes gl { 0%{transform:translate(0)} 50%{transform:translate(-6px,3px)} 100%{transform:translate(5px,-2px)} }
  /* tables */
  table { width:100%; border-collapse:collapse; font-size:34px; }
  td, th { padding:20px 12px; border-bottom:1px solid var(--line); text-align:left; }
  th { font-size:22px; color:var(--mute); font-weight:500; text-transform:uppercase; letter-spacing:.08em; }
  tr.x { animation-name: riseX; }
  .loss { font-weight:700; color:var(--red); font-variant-numeric:tabular-nums; }
  /* law */
  .eq { display:flex; align-items:center; gap:46px; margin:40px 0; }
  .eq .side { text-align:center; } .eq .lbl { font-size:24px; color:var(--mute); text-transform:uppercase; letter-spacing:.14em; }
  .eq .val { font-size:64px; font-weight:600; letter-spacing:-.03em; margin-top:8px; }
  .eq .op { font-size:140px; line-height:1; color:var(--ok); text-shadow:0 0 50px rgba(61,220,151,.6); }
  /* arch */
  svg text { font-family:Inter,sans-serif; }
  .draw { stroke-dasharray:1400; animation: dash 1.6s ease var(--at) both; }
  @keyframes dash { from { stroke-dashoffset:1400; } to { stroke-dashoffset:0; } }
  /* resources */
  .res { display:grid; grid-template-columns:90px 1fr; gap:26px; align-items:center; margin:16px 0; }
  .res .n { width:78px; height:78px; border-radius:20px; display:grid; place-items:center; font-size:34px; font-weight:700; background:var(--grad); box-shadow:0 0 40px rgba(32,134,255,.5); }
  .res .t { font-size:40px; font-weight:600; letter-spacing:-.02em; }
  .res .d { font-size:27px; color:var(--ink2); margin-top:6px; } .res .d code { font-family:"IBM Plex Mono",monospace; color:var(--soft); font-size:25px; }
  /* modes */
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:34px; margin-top:30px; }
  .term { font-family:"IBM Plex Mono",monospace; font-size:26px; line-height:1.65; background:#03060f; border:1px solid var(--line); border-radius:18px; padding:26px 30px; margin-top:26px; }
  .term .g { color:var(--ok); } .term .b { color:var(--soft); } .term .r { color:var(--red); }
  /* proof */
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:28px; margin:44px 0; }
  .stat .big { font-size:96px; font-weight:600; letter-spacing:-.05em; line-height:1; background:linear-gradient(180deg,#fff,#9cc6ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stat .l { font-size:28px; color:var(--ink2); margin-top:14px; }
  .sparkle { width:92px; height:92px; }
</style>
</head>
<body>
<div class="stage">
  <div class="beams"><i></i><i></i><i></i></div>
  <div class="redglow" id="redglow"></div>
  <div class="wrap" id="root"></div>
</div>
<script>
const P = new URLSearchParams(location.search);
const scene = P.get("s") || "hook";
const D = Number(P.get("d") || 10);
const SP = `<svg class="sparkle" viewBox="0 0 24 24"><path d="M12 1.5c.6 4.8 2.7 8.4 10.5 10.5-7.8 2.1-9.9 5.7-10.5 10.5-.6-4.8-2.7-8.4-10.5-10.5C9.3 9.9 11.4 6.3 12 1.5z" fill="#fff"/></svg>`;
const S = {
  hook: `

  incidents: `

      <tr class="x" data-at="0.19"><td>Ronin</td><td>2022</td><td class="loss">~$625M</td><td>a burn behind the withdrawals</td></tr>
      <tr class="x" data-at="0.23"><td>Wormhole</td><td>2022</td><td class="loss">~$326M</td><td>a lock behind 120k minted wETH</td></tr>
      <tr class="x" data-at="0.27"><td>Nomad</td><td>2022</td><td class="loss">~$190M</td><td>a proof behind the releases</td></tr>
      <tr class="x" data-at="0.32"><td>Multichain</td><td>2023</td><td class="loss">~$126M</td><td>a burn behind the withdrawals</td></tr>
      <tr class="x" data-at="0.37"><td>Harmony</td><td>2022</td><td class="loss">~$100M</td><td>a burn behind the withdrawals</td></tr>

    <p class="lead x" data-at="0.16" style="margin-top:20px">One rule, enforced across chains:</p>
    <div class="eq x" data-at="0.3">

      <g class="x" data-at="0.52"><rect x="590" y="350" width="440" height="96" rx="18" fill="rgba(32,134,255,.18)" stroke="#4d9dff"/><text x="810" y="390" text-anchor="middle" font-size="26" font-weight="600" fill="#fff">react(): double-entry ledger</text><text x="810" y="426" text-anchor="middle" font-size="22" fill="rgba(255,255,255,.75)">keyed by Hyperlane message id</text></g>

      <g class="x" data-at="0.78"><rect x="890" y="630" width="330" height="56" rx="14" fill="rgba(255,77,94,.1)" stroke="rgba(255,77,94,.6)"/><text x="1055" y="666" text-anchor="middle" font-size="24" fill="#ffc2c8">callback proxy → freeze</text></g>
      <g class="x" data-at="0.86"><text x="810" y="540" text-anchor="middle" font-size="30" fill="rgba(255,255,255,.85)">No bot. No server. No keeper.</text></g>
    </svg>`,
  resources: `
    <span class="pill x" data-at="0.01">Reactive Omni resources in Noether</span>
    <div style="margin-top:30px">
      <div class="res x" data-at="0.06"><div class="n">1</div><div><div class="t">System contract</div><div class="d"><code>0x8888…8888</code>: subscribe · unsubscribe · requestCallbackV_1_0</div></div></div>
      <div class="res x" data-at="0.2"><div class="n">2</div><div><div class="t">Dynamic subscriptions inside react()</div><div class="d">Cron1 clock (<code>0x…fffFfF</code>) only while suspicious · taint tracing on the attacker's <code>Transfer</code>s</div></div></div>
      <div class="res x" data-at="0.47"><div class="n">3</div><div><div class="t">Conditional multi-destination callbacks</div><div class="d">1 reaction → 4 callbacks → 2 chains, via callback proxies <code>0x476F…</code> (Base) · <code>0x775c…</code> (Unichain)</div></div></div>
      <div class="res x" data-at="0.65"><div class="n">4</div><div><div class="t">REACT economy</div><div class="d">≈ 0.0145 REACT per reaction, measured · funded contracts, <code>coverDebt()</code></div></div></div>
      <div class="res x" data-at="0.84"><div class="n">5</div><div><div class="t">Omni ~1 s blocks · Lasna testnet</div><div class="d">decision in the same second as the forged mint · chain id <code>5318007</code></div></div></div>
    </div>`,
  modes: `
    <span class="pill x" data-at="0.01">Usefulness</span>
    <h2 class="x" data-at="0.03">You don't have to rebuild your bridge.</h2>
    <div class="grid2">
      <div class="card x" data-at="0.2"><div style="font-size:24px;color:var(--soft);font-weight:600;text-transform:uppercase;letter-spacing:.06em">Monitor mode</div><div style="font-size:42px;font-weight:600;margin:10px 0">Zero integration</div><div style="font-size:28px;color:var(--ink2)">Audits any Hyperlane route from public events. Live on a third-party route from Hyperlane's registry.</div></div>

    </div>
    <p class="lead x mono" data-at="0.82" style="font-size:30px">noether-ashy.vercel.app · github.com/s70239176-ctrl/noether</p>`,
  hook2: `

        <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ab8ff"/></marker>
