[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./model" }]

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
lasna = "${LASNA_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
sepolia = "${SEPOLIA_RPC}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
